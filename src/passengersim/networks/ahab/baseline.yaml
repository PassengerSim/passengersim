#
# A very simple 3 market example
#

scenario: Moby Dick

db:
  write_items:
    - leg
    - fare
    - demand
    - bookings
    - bucket
    - pathclass
  fast: true
  engine: sqlite
  filename: ":memory:"

outputs: {}


simulation_controls:
  num_trials: 1
  num_samples: 1000
  burn_samples: 100
  random_seed: 42
  sys_k_factor: 0.1
  mkt_k_factor: 0.15
  pax_type_k_factor: 0.0  # now simple_k_factor
  simple_k_factor: 0.2
  tf_k_factor: 0.1
  tf_z_factor: 1.0
  tot_z_factor: 2.0
  prorate_revenue: true
  dwm_lite: false
  disable_ap: false
  demand_multiplier: 1.0
  timeframe_demand_allocation: pods
  connection_builder:
    nonstop_leg_path_id_alignment: false
    min_connect_time:
      DD: 20
      DI: 30
      ID: 60
      II: 60
    max_connect_time: 120

choice_models:
  business:
    kind: pods
    emult: 1.6
    restrictions:
      r1: 1.0
      r2: 0.35
      r3: 0.50
  leisure:
    kind: pods
    emult: 1.6
    restrictions:
      r1: 0.70
      r2: 0.35
      r3: 0.35

carriers:
  - name: Pequod
    rm_system: E

classes:
  - Y0
  - Y1
  - Y2
  - Y3
  - Y4
  - Y5

dcps:
  - 63
  - 56
  - 49
  - 42
  - 35
  - 31
  - 28
  - 24
  - 21
  - 17
  - 14
  - 10
  - 7
  - 5
  - 3
  - 1

booking_curves:
  - name: c1  # business
    curve:
      63: 0.06
      56: 0.11
      49: 0.15
      42: 0.2
      35: 0.23
      31: 0.25
      28: 0.28
      24: 0.31
      21: 0.35
      17: 0.4
      14: 0.5
      10: 0.62
      7: 0.7
      5: 0.78
      3: 0.95
      1: 1.0
  - name: c2  # leisure
    curve:
      63: 0.17
      56: 0.25
      49: 0.34
      42: 0.43
      35: 0.49
      31: 0.53
      28: 0.61
      24: 0.69
      21: 0.75
      17: 0.8
      14: 0.85
      10: 0.88
      7: 0.9
      5: 0.95
      3: 0.98
      1: 1.0

places:
  ACK:
    label: Nantucket Memorial Airport
    lat: 41.2531
    lon: -70.0602
    time_zone: America/New_York
  NAN:
    label: Nadi International Airport
    lat: -17.7556
    lon: 177.4433
    time_zone: Pacific/Fiji

legs:
  - carrier: Pequod
    fltno: 101
    orig: ACK
    dest: NAN
    date: 2026-12-25
    dep_time: 08:00
    arr_time: '17:23'
    arr_day: +1
    capacity: 100

demands:
  - orig: ACK
    dest: NAN
    segment: business
    base_demand: 40.0
    reference_price: 2500.0
    choice_model: business
    curve: c1
  - orig: ACK
    dest: NAN
    segment: leisure
    base_demand: 60.0
    reference_price: 1000.0
    choice_model: leisure
    curve: c2


fares:
  - carrier: Pequod
    orig: ACK
    dest: NAN
    booking_class: Y0
    price: 4000.0
    advance_purchase: 0
    restrictions: []
  - carrier: Pequod
    orig: ACK
    dest: NAN
    booking_class: Y1
    price: 3000.0
    advance_purchase: 0
    restrictions:
      - R2
  - carrier: Pequod
    orig: ACK
    dest: NAN
    booking_class: Y2
    price: 2000.0
    advance_purchase: 3
    restrictions:
      - R1
  - carrier: Pequod
    orig: ACK
    dest: NAN
    booking_class: Y3
    price: 1500.0
    advance_purchase: 7
    restrictions:
      - R1
      - R2
  - carrier: Pequod
    orig: ACK
    dest: NAN
    booking_class: Y4
    price: 1250.0
    advance_purchase: 14
    restrictions:
      - R1
      - R3
  - carrier: Pequod
    orig: ACK
    dest: NAN
    booking_class: Y5
    price: 1000.0
    advance_purchase: 21
    restrictions:
      - R1
      - R2
      - R3
