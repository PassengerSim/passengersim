#
# Tiny network, for developing network optimization algorithms
#  - Two carriers
#  - Two fare classes
#  - Two banks, AL1 uses ORD, AL2 uses ATL
#  - Based on a stripped-down 3MKT network
#  - This is uncalibrated and NOT for any real simulation work !!!
#
# AlanW, September 2026
# PassengerSim LLC
#

scenario: Tiny Dev

simulation_controls:
  random_seed: 42
  num_trials: 3
  num_samples: 300
  burn_samples: 50
  sys_k_factor: 0.1
  mkt_k_factor: 0.2
  simple_k_factor: 0.4
  tf_k_factor: 0.1
  tf_z_factor: 2.0
  prorate_revenue: true
  dwm_lite: false
  max_connect_time: 120
  demand_multiplier: 2.0
  manual_paths: false

choice_models:
  business:
    kind: pods
    emult: 1.6
    path_quality:  [38.30,  0.10]
    airline_pref_pods:  [-12.29,  0.17]
    tolerance: 2.0
    r1: 1.0
    r2: 0.35
    r3: 0.50
  leisure:
    kind: pods
    emult: 1.5
    path_quality:  [2.02, 0.12]
    airline_pref_pods:  [-1.98, 0.11]
    tolerance: 5.0
    r1: 0.70
    r2: 0.35
    r3: 0.35

